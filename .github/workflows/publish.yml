name: Publish to GHCR

on:
  push:
    branches: [ "main", "feature/docker-setup" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Memastikan nama image huruf kecil semua (Syarat mutlak GHCR)
      - name: Lowercase image name
        run: echo "LC_IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Menggunakan SHA commit sebagai tag
          tags: ${{ env.REGISTRY }}/${{ env.LC_IMAGE_NAME }}:${{ github.sha }}